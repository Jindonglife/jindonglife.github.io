<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>筋動人生 · 社群影音平台</title>
<meta name="description" content="筋動人生官方 Instagram、Facebook、YouTube 頻道入口。">
<meta name="robots" content="index, follow">
<meta property="og:title" content="筋動人生 · 社群影音平台">
<meta property="og:description" content="筋動人生官方 Instagram、Facebook、YouTube 頻道入口。">
<meta property="og:type" content="website">
<style>
  /* 鎖定淺色模式：LINE 內建瀏覽器在深色模式下會強制反轉頁面顏色造成跑版，此宣告可避免 */
  :root {
    color-scheme: light only;
    --accent: #E06A3B;
    --accent-deep: #B5673A;
    --cream: #FCFAF5;
    --sand: #EFE8D7;
    --sand-deep: #E3D8C0;
    --ink: #2B2420;
    --ink-soft: #6b6055;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--cream);
  }

  body {
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .hero {
    padding: 5vh 28px 14px;
    text-align: center;
  }

  .seal {
    width: min(210px, 52vw);
    height: auto;
    margin: 0 auto 4px;
    display: block;
  }

  h1 {
    font-family: "DFKai-SB", "BiauKai", "Kaiti TC", "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    font-size: clamp(25px, 6.4vw, 32px);
    color: var(--ink);
    margin: 0;
    line-height: 1.42;
    text-wrap: balance;
    font-weight: 700;
  }

  .cards {
    flex: 1;
    padding: 0 24px 44px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  a.card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--sand);
    border-radius: 22px;
    padding: 20px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, background 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  a.card:hover { background: var(--sand-deep); }
  a.card:active { transform: scale(0.98); background: var(--sand-deep); }
  a.card:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }

  .icon {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .body { flex: 1; min-width: 0; }

  .name {
    font-weight: 700;
    font-size: 16px;
    margin: 0;
  }

  .desc {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 4px 0 0;
  }

  .arrow {
    font-size: 18px;
    color: var(--accent-deep);
    flex-shrink: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    a.card { transition: none; }
  }

  /* 平板／桌機：頁面放寬，三卡改橫排並列 */
  @media (min-width: 700px) {
    .page { max-width: 900px; }
    .hero { padding: 7vh 40px 20px; }
    .cards {
      flex-direction: row;
      padding: 0 40px 52px;
      gap: 24px;
    }
    a.card {
      flex: 1;
      flex-direction: column;
      text-align: center;
      gap: 14px;
      padding: 32px 20px;
    }
    .icon { width: 64px; height: 64px; }
    .arrow { order: 3; }
  }
</style>
</head>
